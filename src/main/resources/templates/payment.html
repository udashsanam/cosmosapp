<style xmlns:th="http://www.w3.org/1999/xhtml">
    .payment-container {
        max-width: 900px;
        margin: auto;
        font-family: Arial, sans-serif;
    }

    .payment-title {
        font-size: 22px;
        font-weight: bold;
    }

    .payment-subtitle {
        color: #666;
        margin-bottom: 20px;
    }

    .payment-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .payment-card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        cursor: pointer;
        text-align: center;
        transition: 0.2s;
    }

    .payment-card:hover {
        border-color: #60bb46;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .payment-card img {
        height: 40px;
        margin-bottom: 10px;
    }

    .selected {
        border: 2px solid #60bb46;
    }
</style>


<body xmlns:th="http://www.w3.org/1999/xhtml"><div class="payment-container">
